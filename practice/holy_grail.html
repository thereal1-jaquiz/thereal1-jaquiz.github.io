<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Holy Grail Layout Practice</title>
        <style>
            .grid {
                display: grid;
                height: 100vh;
                grid:
                'head head head' 150px
                'menu main menu2' 1fr
                'foot foot foot' 150px
                /200px 1fr 200px;
            }
            #header{
                grid-area: head;
                background-color: papayawhip;
                border: 2px solid black;
                text-align: center;
                font-size: 24px;
                color: darkblue
            }
            #menu{
                grid-area: menu;
                background-color: papayawhip;
                border: 2px solid black;
                text-align: center;
                font-size: 24px;
                color: darkblue
            }
            #menu2{
                grid-area: menu2;
                background-color: papayawhip;
                border: 2px solid black;
                text-align: center;
                font-size: 24px;
                color: darkblue
            }
            #main{
                grid-area: main;
                background-color: papayawhip;
                border: 2px solid black;
                text-align: center;
                font-size: 24px;
                color: darkblue
            }
            #footer{
                grid-area: foot;
                background-color: papayawhip;
                border: 2px solid black;
                text-align: center;
                font-size: 24px;
                color: darkblue
            }
            </style>
        </head>
    <body>
        <div class="grid">
        </div>
    </body>
</html>
