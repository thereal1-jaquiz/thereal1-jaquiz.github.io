<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="../js/validate.js"></script>
        <title> Christmas Tree</title>
        <style>
            body{
                background-color:papayawhip;
            }
            #container{
                background-color:papayawhip;
                width:600px
                height:100px
            }
            #tree{
                width: 0px;
                height: 0px;
                border-bottom: 600px solid forestgreen;
                border-left: 250px solid transparent;
                border-right: 250px solid transparent;
            }
            #box{
                position: absolute;
                width: 30px;
                height: 30px;
                background-color: red;
            }
            #trunk{
                width: 40px solid sienna;
                height: 50px;
            }
        </style>

    </head>
    <body>
        <h1>This is a tree</h1>
        <div id="container">
            <div id="tree">    
                <div id="box">
                    <div id="trunk">
                        
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
