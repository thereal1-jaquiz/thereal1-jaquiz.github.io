<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prison Break
    </title>
    <link rel="stylesheet" href="game.css">
    <link rel="stylesheet" href="https://use.typekit.net/pmy1nwf.css">

</head>
<body>
    <h1>PrisonBreak</h1>
    <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
            <span class="prompt">></span>
            <input type="text" id="user-input" placeholder="Type your command..." autofocus>
        </div>
    </div>
    <script src="game_helpers.js"></script>
    <script src="game.js"></script>
    <script>
    // Start the game when the window loads
    window.onload = function() {
        start();
    };
    </script>
    
<div class="options-container">
    <button id="about-button" onclick="about()">About</button>
    <button id="restart-button" onclick="start()">Restart</button>
</div>
</body>
</html>
