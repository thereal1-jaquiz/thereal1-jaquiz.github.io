<!DOCTYPE html>
<html lang="en">
<head>
    <title>Portrait</title>
    <style>
        canvas{
            border: black solid 1px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Portrait</h1>
    <canvas id="myCanvas" width="800" height="1000">
    </canvas>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#C9E4DE";
    ctx.fillRect(0, 0, 800, 1000);

        // Face
    ctx.fillStyle = "#FFE4CF";
    ctx.arc(400, 400, 210, 0, 2 * Math.PI);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(320, 720); //move to starting point
    ctx.lineTo(470, 720);
    ctx.lineTo(540, 650);
    ctx.lineTo(605, 510);
    ctx.lineTo(610, 400); //draw line to next point
    ctx.lineTo(190, 400); //draw line to next point
    ctx.lineTo(195, 510); //draw line to next point
    ctx.lineTo(250, 650); //draw line to next point
    ctx.lineTo(320, 720); //move to starting point
    ctx.closePath();
    ctx.fill();
    
    //clothing
    ctx.fillStyle = "#485063"

    ctx.beginPath();
    ctx.moveTo(530, 740); //move to starting point
    ctx.lineTo(700, 780);
    ctx.lineTo(730, 800)
    ctx.lineTo(800, 880);
    ctx.lineTo(800, 1000);
    ctx.lineTo(0, 1000);
    ctx.lineTo(0, 880);
    ctx.lineTo(70, 800);
    ctx.lineTo(110, 780);
    ctx.lineTo(260, 740);
    ctx.lineTo(525, 740); //move to starting point
    ctx.fill();
    ctx.closePath();

    // Neck
    ctx.fillStyle = "#FFE1C9";
   
    ctx.beginPath();
    ctx.moveTo(280, 680); //move to starting point
    ctx.lineTo(270, 745);
    ctx.lineTo(250, 780);
    ctx.lineTo(540, 780);
    ctx.lineTo(520, 745);
    ctx.lineTo(510, 680);
    ctx.lineTo(470, 720);
    ctx.lineTo(320, 720);
    ctx.lineTo(280, 680); //move to starting point
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.ellipse(
    395,780,    //x, y of the center
    145,        //xradius
    95,        //yradius
    0,          //rotation
    0,          //start
    1 * Math.PI //stop
    );
    ctx.fill();

    ctx.ellipse(
    395,780,    //x, y of the center
    145,        //xradius
    55,        //yradius
    0,          //rotation
    1 * Math.PI, //stop
    0
    );
    ctx.fill();

    // Facial features
            // Left eye
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
        ctx.ellipse(490, 460, 35, 18, 0, 0, 2 * Math.PI);
    ctx.fill();

        ctx.fillStyle = "#637A56";
    ctx.beginPath();
    ctx.arc(490, 460, 16, 0, 2 * Math.PI);
    ctx.fill();
        ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(490, 460, 11, 0, 2 * Math.PI);
    ctx.fill();
        ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(489, 457);
    ctx.lineTo(493, 460);
    ctx.lineTo(502, 452);
    ctx.lineTo(493, 447);
    ctx.lineTo(489, 457);
    ctx.fill();
    ctx.closePath();

        // Right eye
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
        ctx.ellipse(310, 460, 35, 18, 0, 0, 2 * Math.PI);
    ctx.fill();

        ctx.fillStyle = "#637A56";
    ctx.beginPath();
    ctx.arc(310, 460, 16, 0, 2 * Math.PI);
    ctx.fill();
        ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(310, 460, 11, 0, 2 * Math.PI);
    ctx.fill();
        ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(309, 457);
    ctx.lineTo(313, 460);
    ctx.lineTo(322, 452);
    ctx.lineTo(313, 447);
    ctx.lineTo(309, 457);
    ctx.fill();
    ctx.closePath();

    //Nose, Mouth, and other stuff, wish i had more time to work on this :(
        ctx.fillStyle = "#E8BCAE";
    ctx.beginPath();
    ctx.ellipse(395, 640, 60, 16, 0, 0, 1 * Math.PI);
    ctx.fill();
    ctx.ellipse(375, 640, 40, 12, 0, 1 * Math.PI, 0);
    ctx.fill();
    ctx.ellipse(415, 640, 40, 12, 0, 1 * Math.PI, 0);
    ctx.fill();


    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(400, 500);
    ctx.lineTo(375, 575);
    ctx.lineTo(400, 575);
    ctx.stroke();
    ctx.moveTo(330, 640);
    ctx.lineTo(460, 640);
    ctx.stroke();
    ctx.closePath();

    //eyebrows
    ctx.fillStyle = "#EBD5B2";
    ctx.beginPath();
    ctx.moveTo(255, 440);
    ctx.lineTo(255, 445);
    ctx.lineTo(320, 430);
    ctx.lineTo(355, 440);
    ctx.lineTo(355, 420);
    ctx.lineTo(315, 415);
    ctx.fill();
        ctx.beginPath();
    ctx.moveTo(550, 440);
    ctx.lineTo(550, 445);
    ctx.lineTo(485, 430);
    ctx.lineTo(450, 440);
    ctx.lineTo(450, 420);
    ctx.lineTo(490, 415);
    ctx.fill();
        ctx.closePath();

        // Ears
    ctx.fillStyle = "#FFE4CF";
    ctx.beginPath();
    ctx.ellipse(190, 500, 30, 60, Math.PI/-10.5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(610, 500, 30, 60, Math.PI/10.5, 0, 2 * Math.PI);
    ctx.fill();

    // Hair... or atleast an attempt at it lol
    ctx.fillStyle = "#EBD5B2";
    ctx.beginPath();
    ctx.ellipse(400, 375, 225, 200, 0, Math.PI, 0);
    ctx.moveTo(175, 375);
    ctx.lineTo(190, 395);
    ctx.lineTo(205, 375);
    ctx.lineTo(220, 395);
    ctx.lineTo(235, 375);
    ctx.lineTo(250, 395);
    ctx.lineTo(265, 375);
    ctx.lineTo(280, 395);
    ctx.lineTo(295, 375);
    ctx.lineTo(310, 395);
    ctx.lineTo(325, 375);
    ctx.lineTo(340, 395);
    ctx.lineTo(355, 375);
    ctx.lineTo(370, 395);
    ctx.lineTo(385, 375);
    ctx.lineTo(400, 395);
    ctx.lineTo(415, 375);    
    ctx.lineTo(430, 395);
    ctx.lineTo(445, 375);
    ctx.lineTo(460, 395);
    ctx.lineTo(475, 375);
    ctx.lineTo(490, 395);
    ctx.lineTo(505, 375);
    ctx.lineTo(520, 395);
    ctx.lineTo(535, 375);
    ctx.lineTo(550, 395);
    ctx.lineTo(565, 375);
    ctx.lineTo(580, 395);
    ctx.lineTo(595, 375);
    ctx.lineTo(610, 395);
    ctx.lineTo(625, 375);
    ctx.fill();
        </script>
</body>
</html>
