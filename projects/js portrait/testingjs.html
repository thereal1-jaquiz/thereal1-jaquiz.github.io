<!DOCTYPE html>
<html lang="en">
<head>
    <title>Portrait</title>
    <style>
        canvas{
            border: black solid 1px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Portrait</h1>
    <canvas id="myCanvas" width="800" height="1000">
    </canvas>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Face
    ctx.fillStyle = "#FFDFBD";
    ctx.arc(400, 400, 210, 0, 2 * Math.PI);
    ctx.fill();

    ctx.fillRect(320, 450, 150, 270);

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.moveTo(470, 720); //move to starting point
    ctx.lineTo(470, 650); //draw line to next point
    ctx.lineTo(540, 650); //draw line to next point
    ctx.lineTo(470, 720); //move to starting point
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.moveTo(320, 720); //move to starting point
    ctx.lineTo(320, 650); //draw line to next point
    ctx.lineTo(250, 650); //draw line to next point
    ctx.lineTo(320, 720); //move to starting point
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.moveTo(195, 510); //move to starting point
    ctx.lineTo(230, 450); //draw line to next point
    ctx.lineTo(190, 400); //draw line to next point
    ctx.lineTo(195, 510); //move to starting point
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.moveTo(195, 510); //move to starting point
    ctx.lineTo(230, 450); //draw line to next point
    ctx.lineTo(190, 400); //draw line to next point
    ctx.lineTo(195, 510); //draw line to next point
    ctx.fill();
    ctx.closePath();
        </script>
</body>
</html>
