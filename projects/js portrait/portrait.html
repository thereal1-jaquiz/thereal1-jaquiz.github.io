<!DOCTYPE html>
<html lang="en">
<head>
    <title>Portrait</title>
    <style>
        canvas{
            border: black solid 1px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Portrait</h1>
    <canvas id="myCanvas" width="800" height="1000">
    </canvas>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Face
    ctx.fillStyle = "#FFDFBD";
    ctx.arc(400, 400, 210, 0, 2 * Math.PI);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(320, 720); //move to starting point
    ctx.lineTo(470, 720);
    ctx.lineTo(540, 650);
    ctx.lineTo(605, 510);
    ctx.lineTo(610, 400); //draw line to next point
    ctx.lineTo(190, 400); //draw line to next point
    ctx.lineTo(195, 510); //draw line to next point
    ctx.lineTo(250, 650); //draw line to next point
    ctx.lineTo(320, 720); //move to starting point
    ctx.fill();
    ctx.closePath();

    // Neck
    ctx.fillStyle = "#FFDABD";
   
    ctx.beginPath();
    ctx.moveTo(280, 680); //move to starting point
    ctx.lineTo(270, 745);
    ctx.lineTo(250, 780);
    ctx.lineTo(540, 780);
    ctx.lineTo(520, 745);
    ctx.lineTo(510, 680);
    ctx.lineTo(470, 720);
    ctx.lineTo(320, 720);
    ctx.lineTo(280, 680); //move to starting point
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.ellipse(
    395,780,    //x, y of the center
    145,        //xradius
    95,        //yradius
    0,          //rotation
    0,          //start
    1 * Math.PI //stop
    );
    ctx.fill();

    ctx.ellipse(
    395,780,    //x, y of the center
    145,        //xradius
    55,        //yradius
    0,          //rotation
    1 * Math.PI, //stop
    0
    );
    ctx.fill();


    //clothing
        ctx.fillStyle = "lightblue"

    ctx.beginPath();
    ctx.moveTo(x, y); //move to starting point
    ctx.lineTo(x, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y); //move to starting point
    ctx.fill();
    ctx.closePath();


        </script>
</body>
</html>
